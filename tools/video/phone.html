<!doctype html>
<html><head><meta charset="utf-8"><title>phone frame</title>
<style>
  html, body { margin: 0; width: 960px; height: 540px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #1b2630 0%, #0a0e12 70%); font-family: Bahnschrift, "Segoe UI", sans-serif; }
  #phone { position: absolute; left: 50%; top: 44%; width: 900px; height: 446px; transform: translate(-50%, -50%); border-radius: 46px; background: #050607;
    box-shadow: 0 0 0 2px #2b3138, 0 0 0 7px #11151a, 0 30px 80px rgba(0,0,0,.65), inset 0 0 0 2px #1a1f25; }
  #screen { position: absolute; left: 28px; top: 28px; width: 844px; height: 390px; border-radius: 22px; overflow: hidden; background: #000; }
  #screen iframe { width: 844px; height: 390px; border: 0; display: block; }
  #cam { position: absolute; left: 12px; top: 50%; width: 9px; height: 9px; margin-top: -4px; border-radius: 50%; background: #1b2229; box-shadow: inset 0 0 0 2px #0d1014; }
  .thumb { position: absolute; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.34), rgba(255,255,255,.12) 60%, rgba(255,255,255,0) 72%); border: 2px solid rgba(255,255,255,.5); opacity: 0; pointer-events: none; z-index: 5; }
</style></head>
<body>
  <div id="phone"><div id="cam"></div><div id="screen"><iframe id="game" src="/index.html?test=1&touch=1&q=medium&dpr=2&seed=5"></iframe></div></div>
  <div class="thumb" id="t1"></div><div class="thumb" id="t2"></div>
</body></html>
